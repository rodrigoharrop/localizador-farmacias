<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localizador de Farmácias - Desconto Especial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>💊 Suas Farmácias Parceiras</h1>
        <p>Compre com desconto especial nos pontos de venda mais próximos</p>
    </div>

    <div class="container">
        <div class="info-banner">
            ℹ️ Clique em uma farmácia no mapa ou use sua localização para ordenar por distância
        </div>

        <!-- Mapa Principal -->
        <div id="map"></div>

        <!-- Botão de Localização -->
        <div class="geo-card">
            <button class="geo-btn" id="geoBtn" onclick="obterLocalizacao()">
                <span>📍</span>
                <span id="geoText">Usar minha localização</span>
            </button>
            <div class="cep-input-container">
                <input type="text" id="cepInput" class="cep-input" placeholder="Ou insira seu CEP (ex: 60175047)">
                <button class="cep-btn" onclick="buscarPorCep()">Buscar</button>
            </div>
        </div>

        <!-- Filtros por Rede -->
        <div class="filters" id="filters">
            <button class="filter-btn active" onclick="filtrarRede('todas')">Todas</button>
            <button class="filter-btn" onclick="filtrarRede('PAGUE MENOS')">
                <img src="Logotipo_da_Pague_Menos.svg.webp" alt="Pague Menos" class="filter-logo">
            </button>
            <button class="filter-btn" onclick="filtrarRede('DROGASIL')">
                <img src="Logotipo_da_Drogasil_(2024).svg.webp" alt="Drogasil" class="filter-logo">
            </button>
            <button class="filter-btn" onclick="filtrarRede('EXTRAFARMA')">
                <img src="Logotipo_Extrafarma.png" alt="Extrafarma" class="filter-logo">
            </button>
            <button class="filter-btn" onclick="filtrarRede('OUTRAS')">Outras</button>
        </div>

        <!-- Farmácias por Rede -->
        <div id="farmaciasContainer"></div>

        <div id="empty" class="empty-state" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            </svg>
            <p>Nenhuma farmácia encontrada</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
